name: keep-alive (Render free)

on:
  schedule:
    - cron: '*/10 22-23,0-15 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the app
        run: |
          curl -fsS --max-time 60 https://cyborgcheebeeoffice.onrender.com/api/health && echo " app is awake" || echo "app ping failed — no action needed"
